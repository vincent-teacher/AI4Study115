<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生成式AI輔助學生學習</title>
<meta name="description" content="生成式AI輔助學生學習：生成式 AI 在教師教學與學生學習的應用——完整教材瀏覽、檢索、練習、測驗與學習歷程。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF6B6B'/%3E%3Crect x='14' y='20' width='36' height='28' rx='10' fill='%23fff'/%3E%3Ccircle cx='25' cy='34' r='4' fill='%2354A0FF'/%3E%3Ccircle cx='39' cy='34' r='4' fill='%2354A0FF'/%3E%3Crect x='30' y='8' width='4' height='12' fill='%23fff'/%3E%3Ccircle cx='32' cy='8' r='4' fill='%23FECA57'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="目錄" data-i18n-aria="menu">☰</button>
  <a class="brand" href="#/home">
    <span class="brand-logo" aria-hidden="true"></span>
    <span class="brand-text"><b data-i18n="siteTitle">生成式AI輔助學生學習</b><small data-i18n="siteSub">生成式 AI 在教學與學習的應用</small></span>
  </a>
  <nav class="topnav" id="topnav"></nav>
  <div class="search-wrap">
    <input id="quickSearch" type="search" autocomplete="off" data-i18n-ph="searchPh" placeholder="搜尋教材內容…（按 / 快速搜尋）">
    <div class="quick-results" id="quickResults" hidden></div>
  </div>
  <button class="icon-btn" id="settingsBtn" aria-label="顯示與操作設定" data-i18n-aria="settings">⚙️</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="章節目錄">
    <div class="side-head"><span data-i18n="chapters">章節目錄</span><button class="icon-btn close-side" id="closeSide" aria-label="關閉">✕</button></div>
    <ol class="side-list" id="sideList"></ol>
  </aside>
  <main id="app" class="main" tabindex="-1"></main>
</div>

<nav class="bottomnav" id="bottomnav"></nav>
<div class="scrim" id="scrim" hidden></div>

<!-- 設定面板 -->
<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="modal-card settings-card">
    <div class="modal-head">
      <h2 id="setTitle">⚙️ <span data-i18n="settingsTitle">顯示與操作設定</span></h2>
      <button class="icon-btn" data-close aria-label="關閉">✕</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="resetSettings" data-i18n="resetSettings">恢復預設</button>
      <button class="btn primary" data-close data-i18n="done">完成</button>
    </div>
  </div>
</div>

<!-- 圖片放大 -->
<div class="lightbox" id="lightbox" hidden>
  <button class="icon-btn lb-close" data-close aria-label="關閉">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一頁">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav lb-next" id="lbNext" aria-label="下一頁">›</button>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="data/pages.js?v=4"></script>
<script src="data/course.js?v=4"></script>
<script src="js/i18n.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
